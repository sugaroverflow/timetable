name: CI

on:
  push:
    branches: [main]
    paths:
      - ".do/**"
      - ".github/workflows/**"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
  pull_request:

jobs:
  # Builds and pushes the dev images in parallel with verify so Deploy Dev
  # (triggered when this workflow completes green) only has to ship them.
  # Push-only: PRs never see the timetable-dev secrets. Images for commits
  # that fail verify are never deployed and get pruned/GC'd. Keep the web
  # build env in sync with the fallback build in deploy-dev.yml.
  build-images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: timetable-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build -w @timetable/web
        env:
          NEXT_PUBLIC_API_URL: "https://dev.timetable.love"
          NEXT_PUBLIC_GRAPHQL_URL: "https://dev.timetable.love/graphql"
          GRAPHQL_ROUTE_URL: "https://dev.timetable.love/graphql"
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: "/timetables"
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: "/timetables"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Authenticate with DO Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push web + api images
        run: |
          WEB="registry.digitalocean.com/timetable-reg/web:${{ github.sha }}"
          API="registry.digitalocean.com/timetable-reg/api:${{ github.sha }}"
          docker build -f apps/web/Dockerfile -t "$WEB" .
          docker build -f apps/api/Dockerfile -t "$API" .
          docker push "$WEB"
          docker push "$API"

  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timetable
          POSTGRES_PASSWORD: timetable
          POSTGRES_DB: timetable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timetable -d timetable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://timetable:timetable@localhost:5432/timetable
      DATABASE_SSL: disable
      AUTH_SECRET: ci-dummy-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build first so Next.js generates its type files (next-env.d.ts) before
      # the standalone typecheck step runs against the web app.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        run: npm run test:e2e

      - name: Apply migrations
        run: npm run db:migrate
